; ==============================================================
;  DIRECT CONTROL - SETTINGS  (v1.5.0)
;
;  Everything here is easier to change in game: Options > Direct
;  Control.  [FirstPerson] edits from this file apply after you
;  toggle first person off and on (press P twice).
; ==============================================================

[Keybinds]
ToggleDC         = V
MoveForward      = W
MoveBackward     = S
MoveLeft         = A
MoveRight        = D
SpeedCycle       = X
SelectControl    = G
FirstPerson      = P
; Sneak: SHIFT + this key (first person and third-person camera).
SneakToggle      = C
; Swap the third-person action camera to the other shoulder.
SwapShoulder     = H
; Manual combat (toggle): your character only swings when you press Attack.
ManualAttack     = Z
Attack           = E
; Hold to guard; tap as a hit lands for a perfect block.
Block            = F
; Press as an attack comes in.
Dodge            = Q
; Key layout version - leave as is (2 = v1.5: Block F, control G).
KeyLayout        = 2

[Settings]
; Camera faces your character when their inventory opens
; (false = keep moving with WASD while looting/trading).
InventoryFaceCam = true
; Cap WASD speed at your character's real max speed.
WasdSpeedCap     = true
WasdSpeedMult    = 1.0
; Enemies chase at full speed and can attack while you WASD-move.
EnemyPursuit     = true

; --- Manual combat ---
; Block and Dodge keys on/off.
ManualBlock      = true
; Your character still blocks on their own in manual combat
; (false = only your own Block / Dodge presses stop hits).
AiBlocksInManual = true
; Hold Block: longest the guard lasts, then the wait before it counts again (ms).
BlockHoldMs            = 1200
BlockCooldownMs        = 800
; Tap Block: perfect-block window after the tap; after a perfect block the next press is free for RewardMs (ms).
PerfectBlockWindowMs   = 1000
PerfectBlockRewardMs   = 1200
; Dodge: how long a press is remembered, the skill bonus for a timed press, extra wait after.
DodgeWindowMs          = 600
DodgeSkillBonus        = 20
DodgeCooldownMs        = 300
; Attack: how long a press is remembered; step-in time when out of reach.
AttackWindowMs         = 400
AttackApproachMs       = 1500
; Pause after a swing / dodge before the next press counts; ignore double-presses closer than this.
AttackRecoveryMs       = 400
DodgeRecoveryMs        = 400
InputRepeatGuardMs     = 250
; Targeting: crosshair cone (first / third person) and cursor radius (normal camera).
AimConeDeg             = 35
AimHoverPx             = 70
; On-screen cues: target name + health bars; glint on weapons swinging at you.
AimNameTag             = false
WeaponGlint            = true
GlintLeadMs            = 700
GlintPx                = 22

; --- Third-person camera (CTRL) ---
OtsDistance      = 20
OtsHeight        = 15.0
OtsSide          = 4.0
; Near plane when a wall pushes the camera in close.
OtsNearClip      = 0.15

; --- Troubleshooting ---
; Writes every combat and movement event to RE_Kenshi_log.txt.
VerboseLog       = false

[FirstPerson]
; Mouse-look sensitivity (0.1-5).
Sensitivity      = 1.0
; Field of view in degrees (50-110).
FOV              = 75
; Clipping distance: lower shows more of your own body but makes
; distant grass shimmer when you turn.  1.0 is the balance.
NearClip         = 1.0
; Clipping distance while knocked down / ragdolled (body stays solid).
DownNearClip     = 0.05
; Draw your own body double-sided so it is solid from the inside.
BodySolidInside  = 1
; Hide your own head / hats and beard / hair in first person.
HeadPixelHide    = 1
; Legacy head hide (shrinks the head bone instead).  Turn this on - and
; HeadPixelHide off - for custom races that render wrong with the normal hide.
HideHead         = 0
HideHeadgear     = 1
HideHair         = 1
; Suppress the hand-to-head/wound injury poses (they cover the lens).
HideInjuryOverlay = 1
; Render the storeys below you inside multi-floor buildings.
FloorRevealBelow = 1

; ==============================================================
;  WARBORN - KCD 2-style combat layer (Phase 1)
;  Damage rules apply to EVERY fighter (NPCs too), so it stays fair.
;  Hit-stop and camera shake only when Direct Control is on (V)
;  and your character is in the exchange.
; ==============================================================
[Warborn]
Enabled            = true
; Log every hit you deal/take with its numbers to RE_Kenshi_log.txt (for tuning).
Log                = true

; --- Damage: skill + armour ---
SkillDamage        = true
; Applied to all melee damage, last. 1.0 = normal.
GlobalDamageMult   = 1.0
; Skill gap: damage x (1 + (attackSkill - defenceSkill)/100 * this).
SkillGapScale      = 0.6
SkillMultMin       = 0.6
SkillMultMax       = 1.6
; Extra damage on an exposed target, at attacker skill 100 (0.8 = +80%).
; Exposure falls with each worn armour piece; ArmorPiecesForFull pieces = none.
UnarmoredBonus     = 0.8
ArmorPiecesForFull = 4
; Final damage multiplier is clamped to this range.
MinTotalMult       = 0.35
MaxTotalMult       = 2.2

; --- Impact feel ---
HitStop            = true
; Freeze length for a reference-strength hit, and the cap (ms).
HitStopMs          = 70
HitStopMaxMs       = 140
; Game speed during the freeze (0.08 = 8% speed).
HitStopSpeed       = 0.08
CameraShake        = true
; Jolt size (game units, ~10 cm each) for a reference hit, and its length (ms).
ShakeAmp           = 0.8
ShakeMs            = 200
; Damage that counts as a "reference" hit.
ImpactRefDamage    = 40
; Impact multipliers: blocked hit, hit on metal/chain armour, hit taken by you.
BlockImpact        = 0.5
ArmorImpact        = 0.75
TakenImpact        = 0.85

; --- KCD 2 combat stance ---
; Press to enter/leave the stance: Direct Control + manual combat + action
; camera turn on, the nearest enemy is locked and the camera follows them.
StanceKey          = R
; Lock the next enemy.
SwitchTargetKey    = TAB
; In the stance: left click = attack, right click = block (hold / tap for a
; perfect block). Hold Alt for a free cursor.
MouseCombat        = true
; Camera turns to keep the locked enemy in view (mouse picks the swing instead).
LockCamera         = true
CameraFollow       = 8.0
; Lock reach, and how far they can get before the lock lets go (game units).
LockRange          = 60
LockBreakRange     = 90
; Flick the mouse up/left/right/down to choose OVERHEAD/LEFT/RIGHT/RISING;
; stay still for DirectionResetMs and the next swing is a THRUST.
DirectionalAttacks = true
DirectionFlickPx   = 14
DirectionResetMs   = 1500

; --- Realism ---
; Cap how fast anyone can swing / block, however high their skill
; (1.0 = normal speed). Kenshi masters otherwise move superhumanly fast.
RealisticSpeed     = true
AttackSpeedMax     = 1.35
BlockSpeedMax      = 1.35

; --- Staggers (hit reactions with Kenshi's own stumble animations) ---
; A strong hit can stagger whoever takes it - you too. More likely with more
; damage, blunt weapons and Strength; less with armour and Toughness.
Staggers           = true
; Damage around which staggers start to happen.
StaggerDamage      = 25
StaggerMaxChance   = 0.85
; The same fighter can't be staggered again this soon (ms) - no stun-lock.
StaggerCooldownMs  = 1500
; A perfect block staggers the attacker back: your opening to counter.
ParryStagger       = true
