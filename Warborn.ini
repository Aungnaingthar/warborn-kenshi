; ==============================================================
;  WARBORN: WORLD - settings
;  A living world: factions plan wars and conquer towns, messengers
;  bring the news, you earn reputation, take contracts, recruit
;  people and command your band. Realistic combat for everyone.
; ==============================================================
[Warborn]
; Detailed log in RE_Kenshi_log.txt (keep on while we test).
Log                = true

; --- Living world: planned wars and conquest ---
Wars               = true
; Real minutes (game running, not paused) between new war plans.
WarIntervalMin     = 6
; How many wars can run at once.
MaxWars            = 3
; Rumours of gathering forces come this long before the march (minutes).
PlanMin            = 2
; From the march to the outcome (minutes).
ResolveMin         = 8
; Towns can change owner when an assault succeeds.
Conquest           = true
; Base chance an assault takes the town (strength, last stands and YOUR
; help change it).
ConquestBase       = 0.35
; Let the factions plan wars against your own towns too.
AttackPlayerTowns  = false

; --- Reputation ---
; Each enemy fighter your band fells earns this much respect from every
; faction you know that is at war with theirs...
RepPerFelled       = 0.6
; ...but never more than this per faction per 10 minutes.
RepCapPerFaction   = 8
; Fighting on a side in a war at a town (3+ foes felled = full amount).
RepWarHelp         = 12

; --- Recruiting ---
; Point at a person with the mouse, then press this key.
; Every Warborn key uses Alt, so Kenshi's own hotkeys never clash (they are
; switched off while Alt is held). Shift+Alt+R recruits into the warband.
RecruitKey         = ALT+R
; Base chance anyone says yes (your reputation with their faction adds to it).
RecruitBase        = 0.25

; --- Commanding your band (orders, not control) ---
; Orders go to your people near your selected character.
CmdFollowKey       = F5
CmdHoldKey         = F6
; Each attacks the enemy nearest to them.
CmdChargeKey       = F7
; Everyone attacks the enemy nearest your selected character.
CmdFocusKey        = F8
CommandRange       = 150

; --- Journal ---
JournalKey         = ALT+J

; --- Realistic combat (everyone, NPCs too) ---
; Cap swing / block speed: high skill never becomes superhuman speed.
RealisticSpeed     = true
; 1.0 = normal speed.
AttackSpeedMax     = 1.2
BlockSpeedMax      = 1.2
; Skill shows as precision: the skill gap scales damage, and a skilled
; fighter finds the gaps in light armour.
SkillDamage        = true
SkillGapScale      = 0.6
SkillMultMin       = 0.6
SkillMultMax       = 1.6
; Extra damage on an unarmoured target at attacker skill 100 (0.8 = +80%).
UnarmoredBonus     = 0.8
; This many worn armour pieces = fully covered.
ArmorPiecesForFull = 4
MinTotalMult       = 0.35
MaxTotalMult       = 2.2

; --- Fair battles (no 10-on-1 dogpiles) ---
; Fighters spread out over the enemy line instead of all piling on one.
FairBattles           = true
; How many may attack the same person at once.
MaxAttackersPerTarget = 2
; How far (game units, ~10 cm each) a fighter will go to find a free opponent.
FairReassignRange     = 300
; Also apply it to your own people (off = they obey your attack orders).
FairForYourPeople     = false

; --- Your warband (missions you command, you don't control them) ---
; Select one of your people and press to add / remove them from the warband.
WarbandAddKey      = ALT+B
; March on the nearest enemy town or camp and take it.
WarbandTakeKey     = ALT+U
; Patrol a ring around your selected character, fighting any enemy met.
WarbandPatrolKey   = ALT+P
; Come back and follow your selected character.
WarbandReturnKey   = ALT+O
; A place your warband clears and holds (~30 s) becomes yours.
PlayerConquest     = true

; --- Training: sparring and tournaments ---
; Alt+T = the selected fighter spars with the nearest squadmate.
; Shift+Alt+T = tournament for all your fighters nearby.
TrainKey           = ALT+T
; Damage in a spar (0.35 = 35%): bruises and knock-downs, not deaths.
SparDamage         = 0.35
; Longest bout (seconds).
SparSeconds        = 90
; Extra experience from training (2 = twice as much).
SparXp             = 1.0
; Alt+Y: mark a training yard where your selected person stands (again, with
; someone inside it, to remove it). Your people inside spar in pairs on their
; own, rest, and go again - weapon skill, attack, defence, dodge, toughness.
YardKey            = ALT+Y
; Size of the yard (game units, ~10 cm each: 120 = about 24 m across).
YardRadius         = 120
; Rest between bouts (seconds).
YardRestSeconds    = 40

; --- Training dummies with a partner ---
; Put your people on Kenshi's training dummies the normal way. Two of them
; training at dummies close together become partners and learn much faster
; (weapon, attack, defence, dodge, toughness), past the dummy's usual limit.
; Experience every ~6 seconds:
PartnerXp          = 0.4
SoloDummyXp        = 0.1
; How close the two dummies must be (game units, 200 = about 20 m).
PartnerRange       = 200

; --- Your people: traits, bond, loyalty, age, marriage ---
; Alt+H = talk to the person under the mouse (press again for the next topic).
TalkKey            = ALT+H
; Alt+M = marry the selected person to the nearest unmarried one of your people.
MarryKey           = ALT+M
; Real minutes (game running) per year of age. Old fighters weaken after 55.
YearMinutes        = 60
; From 70 on, people may die of old age.
OldAgeDeath        = true
; Low loyalty can lead to betrayal (theft, desertion, prisoners escaping).
Betrayal           = true
; 2 = twice as likely, 0.5 = half.
BetrayalRate       = 1.0
; Betrayers may leave for the faction they came from.
BetrayalDesert     = true

; --- Easier learning ---
; Smithing skills (weapons, armour, bows) learn this many times faster.
SmithingXpMult     = 3.0
; Every skill (1.0 = normal).
LearnMult          = 1.0
